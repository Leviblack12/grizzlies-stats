<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weston Blevins — combined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#111;--line:#2a2a2a;--gold:#F5C02C;--white:#fff;--muted:#8a8a86;
    --display:"Bebas Neue",Impact,sans-serif;--body:"Inter",Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .card{width:100%;padding:4px 2px}
  .slash{display:grid;grid-template-columns:repeat(4,1fr);margin:2px 0 12px}
  .slash .c{text-align:center}
  .slash .v{font-family:var(--display);font-size:clamp(18px,6.5vw,30px);color:var(--gold);font-variant-numeric:tabular-nums}
  .slash .l{font-size:clamp(7px,2.2vw,9px);color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px}
  .stat{text-align:center;min-width:30px}
  .stat .v{font-size:clamp(12px,3.6vw,16px);font-weight:600;font-variant-numeric:tabular-nums}
  .stat .l{font-size:clamp(7px,2vw,9px);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
  .pitch{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .pitch .lab{font-family:var(--display);font-size:clamp(11px,3.4vw,14px);letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
  <div class="slash">
    <div class="c"><div class="v">.170</div><div class="l">AVG</div></div>
    <div class="c"><div class="v">.290</div><div class="l">OBP</div></div>
    <div class="c"><div class="v">.302</div><div class="l">SLG</div></div>
    <div class="c"><div class="v">.592</div><div class="l">OPS</div></div>
  </div>
  <div class="row">
    <div class="stat"><div class="v">9</div><div class="l">H</div></div>
    <div class="stat"><div class="v">1</div><div class="l">HR</div></div>
    <div class="stat"><div class="v">7</div><div class="l">RBI</div></div>
    <div class="stat"><div class="v">7</div><div class="l">R</div></div>
    <div class="stat"><div class="v">6</div><div class="l">BB</div></div>
    <div class="stat"><div class="v">23</div><div class="l">K</div></div>
    <div class="stat"><div class="v">1</div><div class="l">SB</div></div>
  </div>
  <div class="pitch">
    <div class="lab">Pitching</div>
    <div class="row">
      <div class="stat"><div class="v">0-2</div><div class="l">W-L</div></div>
      <div class="stat"><div class="v">7.0</div><div class="l">IP</div></div>
      <div class="stat"><div class="v">7.00</div><div class="l">ERA</div></div>
      <div class="stat"><div class="v">9</div><div class="l">K</div></div>
      <div class="stat"><div class="v">6</div><div class="l">BB</div></div>
      <div class="stat"><div class="v">2.29</div><div class="l">WHIP</div></div>
      <div class="stat"><div class="v">10</div><div class="l">H</div></div>
      <div class="stat"><div class="v">7</div><div class="l">ER</div></div>
    </div>
  </div>
</div>
</body>
</html>
